<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- BASE_URL 붙이는 게 안전 -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>권경민 | Frontend Developer Portfolio</title>
    <meta
      name="description"
      content="복잡한 시스템을 안전하고 읽기 쉬운 인터페이스로 만드는 프론트엔드 엔지니어 권경민의 포트폴리오입니다."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="권경민 | Frontend Developer Portfolio" />
    <meta
      property="og:description"
      content="실시간 로그 시각화, Web Worker 최적화, 보안 네트워크 구현 경험을 제품 인터페이스로 연결합니다."
    />
    <meta property="og:url" content="https://km-kwon.github.io/portfolio/" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="text/javascript">
      (function (l) {
        if (!l.search) return;

        var q = {};
        l.search
          .slice(1)
          .split("&")
          .forEach(function (v) {
            var a = v.split("=");
            q[a[0]] = a.slice(1).join("=").replace(/~and~/g, "&");
          });

        if (q.p !== undefined) {
          // /portfolio/ 처럼 끝에 /가 여러 개여도 다 제거
          var base = l.pathname.replace(/\/+$/, "");
          var p = (q.p || "").replace(/\/{2,}/g, "/"); // p 내부도 정규화

          window.history.replaceState(
            null,
            null,
            base + p + (q.q ? "?" + q.q : "") + l.hash
          );
        }
      })(window.location);
    </script>
  </head>

  <body>
    <div id="root"></div>
    <!-- Vite는 build 시 이 script를 자동으로 dist용으로 바꿉니다 -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
