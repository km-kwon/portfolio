<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- BASE_URL 붙이는 게 안전 -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>권경민 — Data-heavy Frontend × State × Rendering</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script type="text/javascript">
      (function (l) {
        if (!l.search) return;

        var q = {};
        l.search
          .slice(1)
          .split("&")
          .forEach(function (v) {
            var a = v.split("=");
            q[a[0]] = a.slice(1).join("=").replace(/~and~/g, "&");
          });

        if (q.p !== undefined) {
          // /portfolio/ 처럼 끝에 /가 여러 개여도 다 제거
          var base = l.pathname.replace(/\/+$/, "");
          var p = (q.p || "").replace(/\/{2,}/g, "/"); // p 내부도 정규화

          window.history.replaceState(
            null,
            null,
            base + p + (q.q ? "?" + q.q : "") + l.hash
          );
        }
      })(window.location);
    </script>
  </head>

  <body>
    <div id="root"></div>
    <!-- Vite는 build 시 이 script를 자동으로 dist용으로 바꿉니다 -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
